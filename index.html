        .card {
            position: absolute;
            width: 90%;
            max-width: 600px;
            height: 80%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: stretch;
            transition: transform 0.2s ease;
            padding: 0px;
            user-select: none;
            touch-action: none;
            margin: 0 auto;
            transform-style: preserve-3d;
        }

        .card-content,
        .card-content-back {

            width: 100%;
            height: 100%;
            flex: 1; /* Utilisation de flex pour occuper l'espace disponible */
            /*overflow: auto;*/
            display: flex;
            /* On utilise flex pour répartir la hauteur facilement */

            /* Le contenu s’empile verticalement */
            backface-visibility: hidden;
            position: absolute;
        }

        .card-content {
            z-index: 2; /* Cela garantit que le recto soit toujours au-dessus par défaut */
            overflow: auto;  /* Pour permettre le défilement */
        }

        .card-content-back {
            overflow: auto;  /* Pour permettre le défilement */
            transform: rotateY(180deg);
            z-index: 1; /* Cela assure que l'arrière soit derrière le recto */
        }

        .flipped {
            transform: rotateY(180deg);
        }
        
                
        .flipped .card-content {
            z-index: 1; /* Lorsque la carte est retournée, le recto est derrière */
        }

        .flipped .card-content-back {
            z-index: 2; /* Lorsque la carte est retournée, l'arrière est devant */
        }

        .checkbox-wrapper-2 .ikxBAC {
            appearance: none;
            background-color: #dfe1e4;
            border-radius: 72px;
            border-style: none;
            flex-shrink: 0;
            height: 20px;
            margin: 0;
            position: relative;
            width: 30px;
        }

        .checkbox-wrapper-2 .ikxBAC::before {
            bottom: -6px;
            content: "";
            left: -6px;
            position: absolute;
            right: -6px;
            top: -6px;
        }

        .checkbox-wrapper-2 .ikxBAC,
        .checkbox-wrapper-2 .ikxBAC::after {
            transition: all 100ms ease-out;
        }

        .checkbox-wrapper-2 .ikxBAC::after {
            background-color: #fff;
            border-radius: 50%;
            content: "";
            height: 14px;
            left: 3px;
            position: absolute;
            top: 3px;
            width: 14px;
        }

        .checkbox-wrapper-2 input[type=checkbox] {
            cursor: default;
        }

        .checkbox-wrapper-2 .ikxBAC:hover {
            background-color: #c9cbcd;
            transition-duration: 0s;
        }

        .checkbox-wrapper-2 .ikxBAC:checked {
            background-color: #6e79d6;
        }

        .checkbox-wrapper-2 .ikxBAC:checked::after {
            background-color: #fff;
            left: 13px;
        }

        .checkbox-wrapper-2 :focus:not(.focus-visible) {
            outline: 0;
        }

        .checkbox-wrapper-2 .ikxBAC:checked:hover {
            background-color: #535db3;
        }

        function getWeightedRandomItem(array) {
            const totalWeight = array.reduce((sum, item) => sum + item.weight, 0);
            const rand = Math.random() * totalWeight;

            let cumulative = 0;
            for (const item of array) {
                cumulative += item.weight;
                if (rand < cumulative) return item;
            }

            return null; // par sécurité, mais normalement jamais atteint
        }

        function getRandomLetter() {
            // Poids approximatifs pour chaque lettre
            // Plus le poids est élevé, plus la lettre a de chances d'être choisie
            const letterWeights = { A: 8, B: 2, C: 7, D: 4, E: 2, F: 4, G: 2, H: 1, I: 7, J: 2, K: 1, L: 6, M: 6, N: 7, O: 5, P: 7, Q: 1, R: 7, S: 8, T: 6, U: 4, V: 3, W: 1, X: 1, Y: 1, Z: 1 };

            // Calcul du poids total
            const totalWeight = Object.values(letterWeights).reduce((sum, weight) => sum + weight, 0);

            // Génère un nombre aléatoire entre 0 et totalWeight
            let random = Math.random() * totalWeight;

            // Sélectionne la lettre en parcourant les poids
            for (const [letter, weight] of Object.entries(letterWeights)) {
                if (random < weight) {
                    return letter;
                }
                random -= weight;
            }

            // Au cas où (normalement jamais atteint)
            return null;
        }
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                // Génère un index aléatoire entre 0 et i
                const j = Math.floor(Math.random() * (i + 1));
                // Échange les éléments array[i] et array[j]
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function resolveRandomChoices(input) {
            return input.replace(/\[([^\[\]]+?)\]/g, (_, content) => {
                const options = content.split(';').map(s => s.trim());
                const choice = options[Math.floor(Math.random() * options.length)];
                return choice;
            });
            }

        function replaceRange(text) {

            players[currentPlayerIndex].name;



            let valRet = text;

            if (difficultyModeOn==1) {
                valRet = valRet.replace(/\[(\d+)-(\d+)\]/g, (match, min, max) => {
                    return min; 
                });
            }
            else if (difficultyModeOn==2) {
                valRet = valRet.replace(/\[(\d+)-(\d+)\]/g, (match, min, max) => {
                    return max-1; 
                });
            }
            else if (difficultyModeOn==3) {
                valRet = valRet.replace(/\[(\d+)-(\d+)\]/g, (match, min, max) => {
                    return max;
                });
            }
            else {
                valRet = valRet.replace(/\[(\d+)-(\d+)\]/g, (match, min, max) => {
                    min = parseInt(min, 10);
                    max = parseInt(max, 10);
                    if (min > max) return match; // Sécurité si min > max
                    return Math.floor(Math.random() * (max - min + 1)) + min;
                });
            }

            const playerName = getPlayerName();

            valRet = valRet.replace(/\[playerX\]/g, () => {
                return playerName[1];
            })

            valRet = valRet.replace(/\[playerCurr\]/g, () => {
                return playerName[0];
            });

            return valRet;
        }

        function adjustFontSize(forcedivId, witdthPercent, heightPercent, heightForceCheck, widthForceCheck, heightMinus, fontMin) {

            //console.log(forcedivId);
            let fontMinValue = 12;
            let witdthPercentValue = 1;
            let heightPercentValue = 1;
            let widthForceCheckValue = 37;//37
            let heightForceCheckValue = 0;//35
            if (witdthPercent)
                witdthPercentValue = witdthPercent;
            if (heightPercent)
                heightPercentValue = heightPercent;
            if (heightForceCheck != undefined)
                heightForceCheckValue = heightForceCheck;
            if (widthForceCheck != undefined)
                widthForceCheckValue = widthForceCheck;
            // Verso de la carte
            let id = "FrontTextId";
            if (!isFront) {
                id = "BackTextId";
            }
            if (forcedivId)
                id = forcedivId;

            const cardText = document.getElementById(id);
            const cardElement = document.getElementById("current-card");

            if (cardText) {
                // Empêcher les coupures de mots
                cardText.style.wordBreak = "keep-all";
                cardText.style.overflowWrap = "normal";

                // Commencer avec une grande taille de police
                let fontSize = 60;
                cardText.style.fontSize = `${fontSize}px`;
                cardText.style.fontWeight = 'bold';

                // Récupérer les dimensions du conteneur
                const cardWidth = cardElement.clientWidth;
                let cardHeight = cardElement.clientHeight;

                // Réduire progressivement la taille jusqu'à ce que le texte rentre

                let prevscrollWidth = cardText.scrollWidth + widthForceCheckValue;

                if(heightMinus)
                    cardHeight = heightMinus;

                if(fontMin)
                    fontMinValue = fontMin;


                while (
                    ((cardText.scrollWidth + widthForceCheckValue) > (cardWidth * witdthPercentValue) || (cardText.scrollHeight + heightForceCheckValue) > (cardHeight * heightPercentValue)) &&
                    fontSize > fontMinValue // taille minimale pour la lisibilité
                ) {
                    fontSize -= 1;
                    //console.log((cardText.scrollWidth+widthForceCheckValue) + " >-- " + (cardWidth * witdthPercentValue))
                    //console.log((cardText.scrollHeight + heightForceCheckValue)+ " ---> " +(cardHeight * heightPercentValue))
                    //console.log(heightForceCheckValue)
                    //console.log(fontSize)
                    
                    cardText.style.fontSize = `${fontSize}px`;
                    if((cardText.scrollHeight + heightForceCheckValue) <= (cardHeight * heightPercentValue)
                        && prevscrollWidth == cardText.scrollWidth + widthForceCheckValue)
                        break;

                    prevscrollWidth = cardText.scrollWidth + widthForceCheckValue;

                }

                

            }
        }


        // Attacher les événements de swipe à la carte
        function attachCardEvents(cardElement) {
            cardElement.addEventListener('mousedown', startDrag);
            cardElement.addEventListener('touchstart', handleTouchStart, { passive: true });

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', handleTouchMove, { passive: false });

            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);



        }

        function handleTouchStart(e) {
            if (desactivateSwipte) return;

            const touch = e.touches[0];
            startDrag({ clientX: touch.clientX });


        }

        function handleTouchMove(e) {
            if (desactivateSwipte) return;

            if (!isDragging) return;
            const touch = e.touches[0];
            drag({ clientX: touch.clientX });
            e.preventDefault();
        }

        function startDrag(e) {
            if (desactivateSwipte) return;

            isDragging = true;
            startX = e.clientX;
            const card = document.getElementById('current-card');
            card.style.transition = 'none';
        }
        const deltaVal = 100;
        function drag(e) {
            if (desactivateSwipte) return;
            if (!isDragging) return;

            const card = document.getElementById('current-card');
            currentX = e.clientX;
            const deltaX = currentX - startX;

            card.style.transform = `translateX(${deltaX}px) rotate(${deltaX * 0.05}deg)`;

            // Changer l'opacité pour indiquer l'action

            if (deltaX > deltaVal) {
                card.style.backgroundColor = 'rgba(38, 222, 129, 0.2)';
            } else if (deltaX < -deltaVal) {
                card.style.backgroundColor = 'rgba(253, 80, 104, 0.2)';
            } else {
                card.style.backgroundColor = currCardBgcol;
            }
        }

        function endDrag() {
            if (desactivateSwipte) return;
            if (!isDragging) return;
            isDragging = false;

            const card = document.getElementById('current-card');

            if (!isFront) {
                //card.classList.remove("flipped");
                //console.log(card)
                //card.classList.add('flipped');
                //console.log(card)
            }

            const deltaX = currentX - startX;

            //console.log(deltaX+" ----  "+deltaVal);
            if (deltaX > deltaVal) {
                swipeRight();
            } else if (deltaX < -deltaVal) {
                swipeLeft();
            } else {
                // Retour à la position initiale
                card.style.transition = 'transform 0.3s ease';
                card.style.transform = 'translateX(0) rotate(0)';
                card.style.backgroundColor = currCardBgcol;
            }
        }

        function swipeLeft() {
            if (currentCardObject) {
                //if(desactivateSwipte) return;
                const card = document.getElementById('current-card');
                card.classList.add('swipe-left');
                // Ajouter 0 points
                if (difficultyModeOn==3)
                    handleSwipe(-currentPointAdded);
                else
                    handleSwipe(0);
            }
        }

        function swipeRight() {

            if (currentCardObject) {
                if (desactivateSwipte && !activateGreenSwipe) return;
                const card = document.getElementById('current-card');
                card.classList.add('swipe-right');
                // Ajouter 1 point
                handleSwipe(currentPointAdded);
            }
        }

        function handleSwipe(points) {
            //if(desactivateSwipte) return;
            // Ajouter les points au joueur actuel
            //console.log(multipleScoreAdd);
            if(multipleScoreAdd.length>0)
            {
                (multipleScoreAdd).forEach(element => {
                    
                    const playerValue = players.filter(p => p.id == element.playerId);

                    if(playerValue && playerValue.length>0)
                        playerValue[0].score += element.score;
                });
            }
            else
            {
                players[currentPlayerIndex].score += points;
            }
            // Arrêter le timer
            clearInterval(timer);

            // Passer au joueur suivant
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;

            // Mettre à jour l'affichage
            updateCurrentPlayer();

            // Attendre que l'animation de swipe soit terminée
            setTimeout(() => {
                // Supprimer la carte actuelle
                const card = document.getElementById('current-card');
                if (card) {
                    card.remove();
                }

                // Afficher la carte suivante
                displayNextCard();

                // Mettre à jour la liste des joueurs
                renderPlayersList();
            }, 500);
        }

        // Démarrer le timer
        function startTimer() {

            const filteredcurrentCardObject = specialType.filter(p => p.id == currentCardObject.type);


            timerValue = filteredcurrentCardObject[0].timer;//timerDuration;
            timerElement.textContent = timerValue;
            timerElement.classList.remove('timer-expired');

            clearInterval(timer);
            timer = setInterval(() => {
                timerValue--;
                timerElement.textContent = timerValue;

                if (timerValue <= 0) {
                    clearInterval(timer);
                    // Indiquer visuellement que le temps est écoulé
                    timerElement.classList.add('timer-expired');
                    // Ne pas swiper automatiquement
                    const currCard = document.getElementById("current-card");

                    //currCard.style.background = "#dc5656";

                    const headDiv = document.getElementById("header");
                    headDiv.style.background = "#dc5656";
                    if(soundModeOn)
                    {
                        audio.play();
                    }

                }
            }, 1000);
        }

        function generateReadableColor() {
            const hue = Math.floor(Math.random() * 360); // Génère une teinte entre 0 et 359
            const saturation = 16; // Saturation fixe à 16%
            const lightness = 81; // Luminosité fixe à 81%

            // Convertir HSL en RGB
            const hslToRgb = (h, s, l) => {
                s /= 100;
                l /= 100;
                const k = n => (n + h / 30) % 12;
                const a = s * Math.min(l, 1 - l);
                const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
                return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
            };

            const [r, g, b] = hslToRgb(hue, saturation, lightness);

            // Convertir en format hexadécimal
            const rgbToHex = (r, g, b) => `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;

            return rgbToHex(r, g, b);
        }

        function renderPlayersList() {
            playersList.innerHTML = '';

                li.style.background = player.bgColor;

                    "</div>";

                });

                // Supprimer ce joueur
                li.querySelector('.delete-player').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deletePlayer(player.id);
                });


                li.querySelector('.add-score-player').addEventListener('click', (e) => {
                    e.stopPropagation();
                    addScore(player.id);
                });
                li.querySelector('.minus-score-player').addEventListener('click', (e) => {

                });

                playersList.appendChild(li);
            });

        // Ajouter un joueur
        function addPlayer(name) {
            if (!name.trim()) return;

            const newPlayer = {
                id: Date.now(),
                name: name,
                score: 0,
                bgColor: generateReadableColor()
            };

            players.push(newPlayer);

            // Si c'est le premier joueur, le définir comme joueur actuel
            if (players.length === 1) {
                currentPlayerIndex = 0;
                updateCurrentPlayer();
            }

            renderPlayersList();
        }

        function updateScore(ind, id, score) {
            const domVal = document.getElementById("playerScore" + id + "");
            domVal.innerText = score;
            if (ind == currentPlayerIndex) {
                currentPlayerScoreElement.textContent = score;
            }

        }

        function addScore(id) {
            const index = players.findIndex(player => player.id === id);
            players[index].score += 1;
            updateScore(index, id, players[index].score);

        }
        function minusScore(id) {
            const index = players.findIndex(player => player.id === id);
            players[index].score -= 1;
            updateScore(index, id, players[index].score);


        }
        // Supprimer un joueur
        function deletePlayer(id) {
            if(players.length <= 2)
            {
                afficherMessage("Il faut au moins 2 joueurs.");
                return;
            }
            const index = players.findIndex(player => player.id === id);
            if (index === -1) return;

            players.splice(index, 1);

            // Ajuster l'index du joueur actuel si nécessaire
            if (currentPlayerIndex >= players.length) {
                currentPlayerIndex = players.length > 0 ? 0 : 0;
            }

            updateCurrentPlayer();
            renderPlayersList();
        }
